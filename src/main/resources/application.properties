spring.application.name=cidades-esg-inteligentes
server.port=${SERVER_PORT:8080}

# Ambiente atual (local, staging, production) - exibido no /actuator/info
app.environment=${APP_ENV:local}

# ---- Banco de dados (valores vem de variaveis de ambiente / .env) ----
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USERNAME:APP_MOBILIDADE}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.initialization-fail-timeout=60000

spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Carga inicial de dados de exemplo
app.seed.enabled=${APP_SEED_ENABLED:true}

# ---- Usuario da API (Basic Auth nos endpoints de escrita) ----
app.security.admin-user=${API_ADMIN_USER:admin}
app.security.admin-password=${API_ADMIN_PASSWORD}

# ---- Actuator (health check usado pelo Docker e pelo pipeline) ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=Cidades ESG Inteligentes - Mobilidade Sustentavel
info.app.version=@project.version@
info.app.environment=${APP_ENV:local}
info.app.build=${APP_BUILD:local}

springdoc.swagger-ui.path=/swagger-ui.html
